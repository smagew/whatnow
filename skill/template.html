<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>/*__TITLE__*/</title>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ee;--paper:#fff;--ink:#17231d;--mut:#586860;--line:#d7dfda;--side:#16241e;--sideink:#dfe9e3;
--ok:#0f7a4a;--okb:#dff3e8;--bad:#b3261e;--badb:#fbe5e3;--part:#8a5a00;--partb:#fbeccb;--no:#586860;--nob:#e7ece9;--acc:#0b6b4f}
*{box-sizing:border-box}
html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Geologica,system-ui,sans-serif;min-height:100vh}
code{font:12px ui-monospace,Menlo,monospace;background:#e8eeea;padding:1px 5px;border-radius:4px}
:focus-visible{outline:3px solid #2a8cff;outline-offset:2px}
header{background:var(--side);color:var(--sideink);padding:14px 24px 0}
.hd{max-width:1180px;margin:0 auto}
/* the header has the same height on every feature: one line each, the full text in a tooltip */
h1{margin:0;font-size:22px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{margin:2px 0 0;color:#9fb3a8;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;gap:10px;margin-top:8px;min-height:26px}
.tbr{max-width:1180px;margin:14px auto 0;display:flex;align-items:flex-end;gap:12px}
.tabs{flex:1;min-width:0;display:flex;gap:2px;overflow-x:auto}
/* a narrow window: the tabs and the update pill get shorter instead of the last tab being cut */
.tbr{container-type:inline-size}@container (max-width:900px){.tabs button{padding:11px 12px}.frl{display:none}}
.tabs button{all:unset;cursor:pointer;padding:11px 18px;border-radius:10px 10px 0 0;color:#a9bdb2;font-weight:500;white-space:nowrap}
.tabs button:hover{color:#fff}.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink);font-weight:600}
.tabs button:focus-visible{outline:3px solid #2a8cff;outline-offset:-3px}
.tabs .cnt{font-size:11px;background:#ffffff26;border-radius:999px;padding:0 7px;margin-left:6px;font-weight:600}.tabs button[aria-selected=true] .cnt{background:#dfe5e1}
.tabs .cnt.bad,.tabs button[aria-selected=true] .cnt.bad{background:#c8372d;color:#fff}
main{max-width:1228px;margin:0 auto;padding:22px 24px 70px}
[role=tabpanel][hidden]{display:none}
.md{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
.list{display:flex;flex-direction:column;gap:6px;position:sticky;top:12px}
.item{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:34px 1fr;gap:2px 10px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;width:100%}
.item:hover{border-color:#9db3a8}.item[aria-selected=true]{border-color:var(--acc);box-shadow:0 0 0 2px #cfe8dd}
.item:focus-visible{outline:3px solid #2a8cff;outline-offset:2px}
.bd{grid-row:1/3;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:15px}
.bd.ok{background:var(--ok);color:#fff}.bd.bad{background:var(--bad);color:#fff}.bd.part{background:#e8b13a;color:#2a1c00}.bd.no{background:#8c9a92;color:#fff}
.item .tt{font-weight:600;font-size:14px;line-height:1.25}.item .vv{font-size:12.5px;color:var(--mut)}
.det{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
.det h2{margin:0;font-size:20px;font-weight:600}.det .vv{margin:2px 0 14px;color:var(--mut)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;margin-right:6px}
.tag.bad{background:var(--badb);color:var(--bad)}.tag.part{background:var(--partb);color:var(--part)}.tag.ok{background:var(--okb);color:var(--ok)}.tag.no{background:var(--nob);color:var(--no)}
.pf{display:grid;grid-template-columns:4fr 6fr;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pf>div{padding:14px 16px}.pf>div+div{border-left:1px solid var(--line);background:#fbfdfc}
.pf h3{margin:0 0 8px;font-size:12.5px;font-weight:600;color:var(--mut)}
.pf ul{list-style:none;margin:0;padding:0}
.plan li{padding:4px 0 4px 16px;position:relative;font-size:13.5px;color:var(--mut)}.plan li::before{content:'';position:absolute;left:2px;top:12px;width:5px;height:5px;border-radius:50%;background:#a9b8b0}
.fact li{display:flex;gap:10px;padding:5px 0;font-size:13.5px}
.ico{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-weight:700;font-size:11px;flex:none}
.y{background:var(--okb);color:var(--ok)}.fixed{background:var(--okb);color:var(--ok)}.bad{background:var(--badb);color:var(--bad)}.p{background:var(--partb);color:var(--part)}.q{background:var(--nob);color:var(--no)}
.empty{color:var(--mut);font-style:italic}
.nav{display:flex;justify-content:space-between;margin-top:14px}
.nav button{all:unset;cursor:pointer;padding:7px 14px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-weight:500;background:#fff}
.nav button:hover{border-color:var(--acc)}.nav button[disabled]{opacity:.35;cursor:default}
.nav button:focus-visible{outline:3px solid #2a8cff}
.bar{height:8px;background:var(--nob);border-radius:4px;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.chk li{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}.chk li:first-child{border-top:0}
.chk{list-style:none;margin:10px 0 0;padding:0}
.rb{margin-top:16px;padding:12px 16px;background:var(--nob);border-radius:12px;font-size:13.5px}.rb b{display:block;margin-bottom:4px}
/* matrix */
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.two .det ul{padding-left:18px;margin:8px 0 0}.two li{margin:6px 0}
@media(max-width:860px){.md{grid-template-columns:1fr}.list{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}.item{min-width:230px;width:230px}.pf{grid-template-columns:1fr}.pf>div+div{border-left:0;border-top:1px solid var(--line)}.two{grid-template-columns:1fr}}

.why{margin:0 0 14px;font-size:16px;max-width:40em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{display:flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px}
.chips button.chip{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;padding:5px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px}
.chips button.chip:hover{border-color:var(--ink)}.chips button.chip[aria-selected=true]{background:var(--side);border-color:var(--side);color:#fff}.chips button.chip:focus-visible{outline:3px solid #2a8cff;outline-offset:2px}
.dt.shut{background:#8c9a92}
.chip b{font-weight:700}.dt{width:10px;height:10px;border-radius:50%;flex:none}.dt.h{background:var(--bad)}.dt.m{background:#e8b13a}.dt.l{background:#8c9a92}.dt.k{background:var(--ok)}
.why.sum{max-width:62em}#ovl{max-width:900px}
.bl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bk{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--bad);border-radius:12px;padding:12px 16px}
.bk.mid{border-left-color:#e8b13a}.bk.low{border-left-color:#8c9a92}
.bk h3{margin:0;font-size:15px;font-weight:600;line-height:1.3}
.sv{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;margin-right:6px;vertical-align:1px}
.sv.high{background:var(--badb);color:var(--bad)}.sv.mid{background:var(--partb);color:var(--part)}.sv.low{background:var(--nob);color:var(--no)}
.pj{display:inline-block;font-size:11.5px;font-weight:600;background:#e8eeea;border-radius:6px;padding:0 6px;margin-left:5px}
.bk p{margin:5px 0 0;color:var(--mut);font-size:13px}
.td{margin-top:8px;font-size:13px;background:#f1f6f3;border-radius:8px;padding:7px 10px}.td b{color:var(--acc);font-weight:600;margin-right:6px}
.td button{all:unset;cursor:pointer;color:var(--acc);text-decoration:underline;margin-left:6px;font-size:12.5px}.td button:focus-visible{outline:3px solid #2a8cff}
body{--sw:0px}
.back{display:inline-block;color:#9fb3a8;font-size:13px;text-decoration:none;margin-bottom:6px}.back:hover{color:#fff;text-decoration:underline}

.fi{flex-wrap:wrap;position:relative;align-items:flex-start}
.fi .ft{flex:1;min-width:0}
.fi .acts{display:flex;gap:6px;flex-basis:100%;margin:2px 0 4px 30px;opacity:0;transition:opacity .12s}
.fi.todo .acts,.fi:hover .acts,.fi:focus-within .acts,.fi.open .acts{opacity:1}
.fi:not(.todo):not(.skipped) .acts{flex-basis:auto;margin:0}.fi:not(.todo):not(.skipped) .ag{order:1}.fi .fm,.fi .sent{order:2}
.acts button{all:unset;cursor:pointer;font-size:12px;font-weight:600;padding:2px 9px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.acts button:hover{border-color:var(--acc);color:var(--acc)}
.acts button.sk{color:var(--bad);border-color:#ecc9c5}.acts button.sk:hover{border-color:var(--bad);background:var(--badb);color:var(--bad)}
.fm.sk{border-color:#e6bdb8;background:#fdf6f5}.fm.sk .fq{margin:0 0 8px;font-weight:600;color:var(--bad);font-size:13.5px}.fm.sk .go{background:var(--bad)}.acts button:focus-visible{outline:3px solid #2a8cff;outline-offset:1px}
.ico.n{background:#eceff5;color:#8b9a92}
.fi.skipped .ft>span.t{text-decoration:line-through;color:var(--mut)}
.why{display:block;font-style:normal;font-size:12.5px;color:var(--mut);margin-top:2px}
.fm{flex-basis:100%;margin:6px 0 4px 30px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfdfc}
.fm textarea{width:100%;min-height:62px;border:1px solid #c3cec7;border-radius:8px;padding:8px 10px;font:inherit;font-size:13.5px;resize:vertical;background:#fff}
.fm .rt{margin:8px 0;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.rt .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none;background:#8b9a92}
.rt.a .dot{background:#2f9e6a}.rt.b .dot{background:#e0a21a}.rt.err .dot{background:var(--bad)}.rt.err{color:var(--bad)}
.fm .row{display:flex;gap:8px;align-items:center}
.fm .go{all:unset;cursor:pointer;background:var(--side);color:#fff;font-size:13px;font-weight:600;padding:6px 14px;border-radius:9px}
.fm .go[disabled]{opacity:.5;cursor:default}.fm .go:focus-visible,.fm .cx:focus-visible{outline:3px solid #2a8cff;outline-offset:2px}
.fm .cx{all:unset;cursor:pointer;font-size:13px;color:var(--mut);padding:6px 8px}
.sent{flex-basis:100%;margin:2px 0 4px 30px;font-size:12.5px;border-radius:8px;padding:5px 10px;background:#e8f0fb;color:#1f4a99}
.sent.done{background:#e6f4ec;color:#0f6b40}.sent.failed{background:#fbe5e3;color:#8c1d18}
.sent .yq{display:block;color:var(--ink);margin-bottom:3px;padding-bottom:4px;border-bottom:1px solid #0000000f}.sent .yq b{font-weight:600}
.sent .yq .yt{white-space:pre-wrap;overflow-wrap:anywhere}.sent .yq:not(.all) .yt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.sent .ym{all:unset;cursor:pointer;display:inline-block;margin-top:2px;font-weight:600;font-size:12px;color:var(--live)}.sent .ym:hover{text-decoration:underline}.sent .ym:focus-visible{outline:3px solid #2a8cff;outline-offset:1px}
.sent .ys{display:block}.sent .yq.all .ym{margin-left:8px}
.mm{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:1px 7px 1px 6px;border-radius:99px;font-size:11px;font-weight:600;line-height:16px;vertical-align:1px;white-space:nowrap;background:#e8f0fb;color:#1f4a99;cursor:default}
.mm.done{background:#e6f4ec;color:#0f6b40}.mm.failed{background:#fbe5e3;color:#8c1d18}.mm:focus-visible{outline:3px solid #2a8cff;outline-offset:1px}
.rr .cnw{display:inline-flex;align-items:center;white-space:nowrap}.rr .rm{flex:none;display:inline-grid;place-items:center;color:var(--live);margin:0 6px 0 4px;vertical-align:-2px}
.ses{position:relative;font-size:13px;color:#cfe3d8;display:flex;flex-wrap:nowrap;white-space:nowrap;gap:6px 10px;align-items:center;min-width:0}
.ses b{color:#fff;font-weight:600}.ses .st{font-size:12px;padding:1px 8px;border-radius:99px;background:#ffffff1f}
.ses .st.work{background:#2f9e6a;color:#fff}.ses .st.bg{background:#3b7be0;color:#fff}.ses .st.wait{background:#e0a21a;color:#2b2000}
.ses button{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:#fff;border:1px solid #ffffff66;padding:2px 10px;border-radius:99px}
.fmw{position:relative;display:inline-flex}.fmw[hidden]{display:none}.fmb{all:unset;cursor:pointer;color:#cfe3d8;width:24px;height:22px;text-align:center;border-radius:8px;font-size:16px;line-height:18px}.fmb:hover{background:#ffffff1f;color:#fff}.fmb:focus-visible{outline:3px solid #7ab8ff;outline-offset:2px}
.fmn{position:absolute;z-index:30;top:calc(100% + 6px);left:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(22,36,30,.28);padding:4px}.fmn[hidden]{display:none}
.fmn button{all:unset;cursor:pointer;display:block;padding:7px 12px;border-radius:7px;color:var(--ink);font-size:13px;font-weight:600;white-space:nowrap}.fmn button:hover,.fmn button:focus-visible{background:#eef3f0}.fmn small{display:block;font-weight:400;color:var(--mut);font-size:11.5px}
.nfw{position:fixed;inset:0;z-index:80;background:rgba(15,27,22,.5);display:grid;place-items:center;padding:20px}.nfw[hidden]{display:none}
.nf{background:var(--paper);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(620px,100%);max-height:calc(100vh - 40px);overflow-y:auto;padding:22px 24px 20px;font-size:13.5px;line-height:1.5}
.nf h2{margin:0 0 6px;font-size:18px}.nf .nfm{margin:0 0 10px;color:var(--mut)}.nf .nfm b{color:var(--ink);font-weight:600}
.nfl{list-style:none;margin:0 0 14px;padding:10px 12px;background:#f5f8f6;border-radius:10px;display:grid;gap:6px}.nfl li{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:baseline}.nfl li>span{color:var(--mut);font-size:12.5px}
.nfl li>div{min-width:0;line-height:1.7}.nfl code{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.nfl small{color:var(--mut)}
.nf .nfb{display:block;font-weight:600;margin-bottom:4px}.nf textarea{width:100%;min-height:92px;border:1px solid #c3cec7;border-radius:9px;padding:9px 11px;font:inherit;resize:vertical;background:#fff}.nf textarea:focus-visible{outline:3px solid #2a8cff;outline-offset:1px}
.nfp{border:0;margin:14px 0 0;padding:0;display:grid;gap:8px}.nfp legend{font-weight:600;padding:0;margin-bottom:6px}
.nfp label{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}.nfp label.on{border-color:var(--live);background:var(--liveb2)}
.nfp input{margin:3px 0 0}.nfp b{font-weight:600}.nfp em{font-style:normal;font-size:11.5px;font-weight:600;color:#0f6b40;background:#e6f4ec;border-radius:99px;padding:1px 8px;margin-left:4px}.nfp small{display:block;color:var(--mut);margin-top:2px;font-size:12.5px}
.nf .row{display:flex;gap:10px;align-items:center;margin-top:16px}.nf .go{all:unset;cursor:pointer;background:var(--side);color:#fff;font-weight:600;padding:8px 18px;border-radius:10px}.nf .go[disabled]{opacity:.55;cursor:default}
.nf .cx{all:unset;cursor:pointer;color:var(--mut);padding:8px 8px}.nf .go:focus-visible,.nf .cx:focus-visible{outline:3px solid #2a8cff;outline-offset:2px}.nf .nferr{color:var(--bad);margin:12px 0 0}.nf .nfok{margin:8px 0 0}
.ses button.pl{width:22px;height:22px;padding:0;text-align:center;font-size:15px;line-height:21px}
.rps{display:flex;gap:6px;align-items:center;min-width:0}.rps button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#cfe3d8;background:#ffffff14;border-radius:99px;padding:2px 10px 2px 8px;white-space:nowrap}
.rps button b{color:#fff;font-weight:600}.rps button i{width:6px;height:6px;border-radius:50%;background:#e8b13a}.rps button:hover{background:#ffffff26}.rps button:focus-visible{outline:3px solid #7ab8ff;outline-offset:2px}.rps small{color:#9fb3a8;font-size:12px}
@media(min-width:861px){body.sb:not(.sm) header #t{display:none}body.sb:not(.sm) header .sub{margin-top:0;font-size:14px;color:#cfe3d8}}
.ses button:hover{background:#ffffff1f}.ses button:focus-visible{outline:3px solid #7ab8ff;outline-offset:2px}
.pick{position:absolute;z-index:40;top:calc(100% + 6px);left:0;padding:8px;background:#22352c;border-radius:10px;width:min(640px,calc(100vw - var(--sw) - 48px));box-shadow:0 12px 32px #0006;white-space:normal}
.pick ul{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}
.pick li button{display:flex;width:100%;box-sizing:border-box;gap:4px 10px;flex-wrap:wrap;align-items:baseline;border:0;border-radius:8px;padding:6px 8px;font-weight:400}
.pick li button:hover{background:#ffffff26}.pick small{color:#a9c7b8}
.lnk{all:unset;cursor:pointer;color:#1f4a99;font-weight:600;text-decoration:underline}.lnk:focus-visible{outline:3px solid #2a8cff;outline-offset:2px}
.sy{max-width:1180px;margin:14px auto -4px;font-size:13px;color:#5a4300;background:var(--warnb);border-radius:8px;padding:8px 12px;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;box-sizing:border-box}.sy[hidden]{display:none}
.syw{padding:0 24px}.sy button{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:#5a4300;border:1px solid #5a430066;padding:2px 10px;border-radius:99px}
.sy button:hover{background:#5a43001a}.sy button:focus-visible{outline:3px solid #2a8cff;outline-offset:2px}
.qb{font-size:12px;color:#2b2000;background:#ffd37a;font-weight:600;border-radius:99px;padding:1px 9px;white-space:nowrap}.qb:empty{display:none}
.bd.almost{background:#e2f3ea;color:#0f6b40;box-shadow:inset 0 0 0 2px #2f9e6a}
.sg{grid-column:2;display:flex;gap:2px;height:6px;margin-top:5px}.sg i{flex:1;border-radius:2px;background:#d9e1dc}.sg i.d{background:var(--ok)}.sg i.p{background:#e8b13a}.sg i.b{background:var(--bad)}
.bk.shut{border-left-color:#8c9a92;opacity:.8}.bk.shut h3{color:var(--mut);font-weight:500}.acts button.dn{background:var(--ok);border-color:var(--ok);color:#fff}
.bk.you{border-left-color:var(--bad)}.bk.look{border-left-color:#e8b13a}.bk.agent{border-left-color:var(--ok)}.bk.later,.bk.none{border-left-color:#8c9a92}
.gh{margin:16px 0 8px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:baseline}.gh:first-child{margin-top:0}.gh small{font-weight:400;color:var(--mut);font-size:12.5px}.gh .c{margin-left:auto;font-weight:700;color:var(--mut)}
.dt.you{background:var(--bad)}.dt.look{background:#e8b13a}.dt.agent{background:var(--ok)}.dt.later,.dt.none{background:#8c9a92}
.bk .acts{display:flex;gap:6px;margin-top:8px}.bk .fm{margin:8px 0 0}.bk .sent{margin:8px 0 0}
/* activity: blue means the agent is here, a fresh change, something in work. Green, amber and red stay for state. */
:root{--live:#1f5fd0;--liveb:#e3ecfc;--liveb2:#f1f5fe;--livel:#b9cdf3}
.ld{width:9px;height:9px;border-radius:50%;background:var(--live);flex:none;display:inline-block}
.pl{animation:pl 1.8s ease-out infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(31,95,208,.5)}100%{box-shadow:0 0 0 9px rgba(31,95,208,0)}}
@keyframes spin{to{transform:rotate(360deg)}}

   with transform, opacity and colour only:

   - a new item slides in from the left with a yellow edge that fades after a moment;
