<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>/*__TITLE__*/</title>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ee;--paper:#fff;--ink:#17231d;--mut:#586860;--line:#d7dfda;--side:#16241e;--sideink:#dfe9e3;
--ok:#0f7a4a;--okb:#dff3e8;--bad:#b3261e;--badb:#fbe5e3;--part:#8a5a00;--partb:#fbeccb;--no:#586860;--nob:#e7ece9;--acc:#0b6b4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Geologica,system-ui,sans-serif;min-height:100vh}
code{font:12px ui-monospace,Menlo,monospace;background:#e8eeea;padding:1px 5px;border-radius:4px}
:focus-visible{outline:3px solid #2a8cff;outline-offset:2px}
header{background:var(--side);color:var(--sideink);padding:14px 24px 0}
.hd{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:8px 28px;align-items:end}
h1{margin:0;font-size:22px;font-weight:600;color:#fff}.sub{margin:2px 0 0;color:#9fb3a8;font-size:13px}
.mini{display:grid;grid-template-columns:auto repeat(6,22px);gap:3px 4px;align-items:center;font-size:11px;color:#9fb3a8;padding-bottom:6px}
.mini .h{writing-mode:vertical-rl;transform:rotate(180deg);height:92px;text-align:left;font-size:10.5px;white-space:nowrap}
.mini b{color:#fff;font-weight:600;padding-right:6px}
.mini i{height:18px;border-radius:5px;display:block}
.mini i.ok{background:#3fbf86}.mini i.part{background:#e8b13a}.mini i.no{background:#3a4a43}
.tabs{max-width:1180px;margin:14px auto 0;display:flex;gap:2px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:11px 18px;border-radius:10px 10px 0 0;color:#a9bdb2;font-weight:500;white-space:nowrap}
.tabs button:hover{color:#fff}.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink);font-weight:600}
.tabs button:focus-visible{outline:3px solid #2a8cff;outline-offset:-3px}
.tabs .cnt{font-size:11px;background:#c8372d;color:#fff;border-radius:999px;padding:0 7px;margin-left:6px;font-weight:600}
main{max-width:1180px;margin:0 auto;padding:22px 24px 70px}
[role=tabpanel][hidden]{display:none}
.md{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
.list{display:flex;flex-direction:column;gap:6px;position:sticky;top:12px}
.item{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:34px 1fr;gap:2px 10px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;width:100%}
.item:hover{border-color:#9db3a8}.item[aria-selected=true]{border-color:var(--acc);box-shadow:0 0 0 2px #cfe8dd}
.item:focus-visible{outline:3px solid #2a8cff;outline-offset:2px}
.bd{grid-row:1/3;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:15px}
.bd.ok{background:var(--ok);color:#fff}.bd.bad{background:var(--bad);color:#fff}.bd.part{background:#e8b13a;color:#2a1c00}.bd.no{background:#8c9a92;color:#fff}
.item .tt{font-weight:600;font-size:14px;line-height:1.25}.item .vv{font-size:12.5px;color:var(--mut)}
.det{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
.det h2{margin:0;font-size:20px;font-weight:600}.det .vv{margin:2px 0 14px;color:var(--mut)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;margin-right:6px}
.tag.bad{background:var(--badb);color:var(--bad)}.tag.part{background:var(--partb);color:var(--part)}.tag.ok{background:var(--okb);color:var(--ok)}.tag.no{background:var(--nob);color:var(--no)}
.pf{display:grid;grid-template-columns:4fr 6fr;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pf>div{padding:14px 16px}.pf>div+div{border-left:1px solid var(--line);background:#fbfdfc}
.pf h3{margin:0 0 8px;font-size:12.5px;font-weight:600;color:var(--mut)}
.pf ul{list-style:none;margin:0;padding:0}
.plan li{padding:4px 0 4px 16px;position:relative;font-size:13.5px;color:var(--mut)}.plan li::before{content:'';position:absolute;left:2px;top:12px;width:5px;height:5px;border-radius:50%;background:#a9b8b0}
.fact li{display:flex;gap:10px;padding:5px 0;font-size:13.5px}
.ico{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-weight:700;font-size:11px;flex:none}
.y{background:var(--okb);color:var(--ok)}.fixed{background:var(--okb);color:var(--ok)}.bad{background:var(--badb);color:var(--bad)}.p{background:var(--partb);color:var(--part)}.q{background:var(--nob);color:var(--no)}
.empty{color:var(--mut);font-style:italic}
.nav{display:flex;justify-content:space-between;margin-top:14px}
.nav button{all:unset;cursor:pointer;padding:7px 14px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-weight:500;background:#fff}
.nav button:hover{border-color:var(--acc)}.nav button[disabled]{opacity:.35;cursor:default}
.nav button:focus-visible{outline:3px solid #2a8cff}
/* deploy */
.bar{height:8px;background:var(--nob);border-radius:4px;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.chk li{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}.chk li:first-child{border-top:0}
.chk{list-style:none;margin:10px 0 0;padding:0}
.rb{margin-top:16px;padding:12px 16px;background:var(--nob);border-radius:12px;font-size:13.5px}.rb b{display:block;margin-bottom:4px}
/* matrix */
.mx{width:100%;border-collapse:separate;border-spacing:6px}
.mx th{font-size:13px;color:var(--mut);font-weight:600;text-align:left;padding:4px 8px}
.mx td.k{font-weight:600;padding:8px;font-size:13.5px;width:30%}.mx td.k small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.mx button{all:unset;cursor:pointer;display:block;width:100%;border-radius:10px;padding:12px 10px;text-align:center;font-weight:600;font-size:13px}
.mx button:focus-visible{outline:3px solid #2a8cff;outline-offset:2px}
.mx button[aria-pressed=true]{outline:3px solid var(--ink)}
.mx .ok{background:var(--okb);color:var(--ok)}.mx .part{background:var(--partb);color:var(--part)}.mx .no{background:var(--badb);color:var(--bad)}.mx .na{background:var(--nob);color:var(--no);font-weight:500}
.note{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-height:48px;font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.two .det ul{padding-left:18px;margin:8px 0 0}.two li{margin:6px 0}
@media(max-width:860px){.md{grid-template-columns:1fr}.list{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px}.item{min-width:230px;width:230px}.pf{grid-template-columns:1fr}.pf>div+div{border-left:0;border-top:1px solid var(--line)}.two{grid-template-columns:1fr}.hd{grid-template-columns:1fr}.mini{display:none}.mx td.k{width:auto}}

.ans{margin:0;font-size:clamp(34px,6vw,48px);line-height:1;font-weight:700;letter-spacing:-.02em}.ans span{color:var(--bad)}
.why{margin:8px 0 14px;font-size:16px;max-width:40em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{display:flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px}
.chip b{font-weight:700}.dt{width:10px;height:10px;border-radius:50%;flex:none}.dt.h{background:var(--bad)}.dt.m{background:#e8b13a}.dt.l{background:#8c9a92}.dt.k{background:var(--ok)}
.ovg{display:grid;grid-template-columns:3fr 2fr;gap:18px;align-items:start}
.ovg h2{margin:0 0 10px;font-size:17px;font-weight:600}
.bl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bk{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--bad);border-radius:12px;padding:12px 16px}
.bk.mid{border-left-color:#e8b13a}.bk.low{border-left-color:#8c9a92}
.bk h3{margin:0;font-size:15px;font-weight:600;line-height:1.3}
.sv{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;margin-right:6px;vertical-align:1px}
.sv.high{background:var(--badb);color:var(--bad)}.sv.mid{background:var(--partb);color:var(--part)}.sv.low{background:var(--nob);color:var(--no)}
.pj{display:inline-block;font-size:11.5px;font-weight:600;background:#e8eeea;border-radius:6px;padding:0 6px;margin-left:5px}
.bk p{margin:5px 0 0;color:var(--mut);font-size:13px}
.td{margin-top:8px;font-size:13px;background:#f1f6f3;border-radius:8px;padding:7px 10px}.td b{color:var(--acc);font-weight:600;margin-right:6px}
.td button{all:unset;cursor:pointer;color:var(--acc);text-decoration:underline;margin-left:6px;font-size:12.5px}.td button:focus-visible{outline:3px solid #2a8cff}
.sq{list-style:none;margin:0;padding:0;counter-reset:s}
.sq li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;padding:8px 0;position:relative;font-size:14px}
.sq li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--side);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;z-index:1}
.sq li::after{content:'';position:absolute;left:12px;top:34px;bottom:-8px;width:2px;background:var(--line)}.sq li:last-child::after{display:none}
.sq span{padding-top:2px}
@media(max-width:860px){.ovg{grid-template-columns:1fr}}
.back{display:inline-block;color:#9fb3a8;font-size:13px;text-decoration:none;margin-bottom:6px}.back:hover{color:#fff;text-decoration:underline}

.fi{flex-wrap:wrap;position:relative;align-items:flex-start}
.fi .ft{flex:1;min-width:0}
.fi .acts{display:flex;gap:6px;flex-basis:100%;margin:2px 0 4px 30px;opacity:0;transition:opacity .12s}
.fi.todo .acts,.fi:hover .acts,.fi:focus-within .acts,.fi.open .acts{opacity:1}
.fi:not(.todo):not(.skipped) .acts{position:absolute;right:0;top:3px;flex-basis:auto;margin:0}.fi:not(.todo):not(.skipped){padding-right:70px}
.acts button{all:unset;cursor:pointer;font-size:12px;font-weight:600;padding:2px 9px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.acts button:hover{border-color:var(--acc);color:var(--acc)}.acts button:focus-visible{outline:3px solid #2a8cff;outline-offset:1px}
.ico.n{background:#eceff5;color:#8b9a92}
.fi.skipped .ft>span.t{text-decoration:line-through;color:var(--mut)}
.why{display:block;font-style:normal;font-size:12.5px;color:var(--mut);margin-top:2px}
.fm{flex-basis:100%;margin:6px 0 4px 30px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfdfc}
.fm textarea{width:100%;min-height:62px;border:1px solid #c3cec7;border-radius:8px;padding:8px 10px;font:inherit;font-size:13.5px;resize:vertical;background:#fff}
.fm .rt{margin:8px 0;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.rt .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none;background:#8b9a92}
.rt.a .dot{background:#2f9e6a}.rt.b .dot{background:#e0a21a}.rt.err .dot{background:var(--bad)}.rt.err{color:var(--bad)}
.fm .row{display:flex;gap:8px;align-items:center}
.fm .go{all:unset;cursor:pointer;background:var(--side);color:#fff;font-size:13px;font-weight:600;padding:6px 14px;border-radius:9px}
.fm .go[disabled]{opacity:.5;cursor:default}.fm .go:focus-visible,.fm .cx:focus-visible{outline:3px solid #2a8cff;outline-offset:2px}
.fm .cx{all:unset;cursor:pointer;font-size:13px;color:var(--mut);padding:6px 8px}
.sent{flex-basis:100%;margin:2px 0 4px 30px;font-size:12.5px;border-radius:8px;padding:5px 10px;background:#e8f0fb;color:#1f4a99}
.sent.done{background:#e6f4ec;color:#0f6b40}.sent.failed{background:#fbe5e3;color:#8c1d18}
.ses{margin-top:8px;font-size:13px;color:#cfe3d8;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ses b{color:#fff;font-weight:600}.ses .st{font-size:12px;padding:1px 8px;border-radius:99px;background:#ffffff1f}
.ses .st.work{background:#2f9e6a;color:#fff}.ses .st.wait{background:#e0a21a;color:#2b2000}
.ses button{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:#fff;border:1px solid #ffffff66;padding:2px 10px;border-radius:99px}
.ses button:hover{background:#ffffff1f}.ses button:focus-visible{outline:3px solid #7ab8ff;outline-offset:2px}
.pick{margin:8px 0 0;padding:8px;background:#ffffff14;border-radius:10px;max-width:640px;width:100%}
.pick ul{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}
.pick li button{display:flex;width:100%;box-sizing:border-box;gap:4px 10px;flex-wrap:wrap;align-items:baseline;border:0;border-radius:8px;padding:6px 8px;font-weight:400}
.pick li button:hover{background:#ffffff26}.pick small{color:#a9c7b8}
.lnk{all:unset;cursor:pointer;color:#1f4a99;font-weight:600;text-decoration:underline}.lnk:focus-visible{outline:3px solid #2a8cff;outline-offset:2px}
.qb{display:block;font-size:12.5px;color:#ffd37a;font-weight:600;margin-top:4px}
</style></head><body>
<header><div class="hd"><div><!--__BACK__--><h1 id="t"></h1><p class="sub" id="sub"></p><span class="qb" id="qb"></span><div class="ses" id="ses"></div></div><div class="mini" id="mini" aria-label="Readiness by project"></div></div>
<div class="tabs" role="tablist" id="tabs"></div></header>
<main id="main"></main>
<script>window.PANEL=/*__DATA__*/null;</script>
<script>
(function(){
var P=window.PANEL,$=function(i){return document.getElementById(i)};
var DONE_K={y:1,fixed:1};
var IC={y:'✓',fixed:'↺',bad:'!',p:'◐',q:'○',ok:'✓',part:'◐',no:'–'};
$('t').textContent=P.title;$('sub').innerHTML=P.sub+(P.updated?' Updated '+P.updated+'.':'');
var m='<span></span>'+P.ladderSteps.map(function(s){return '<span class="h">'+s+'</span>'}).join('');
P.projects.forEach(function(p){m+='<b>'+p+'</b>'+P.ladder[p].map(function(s,i){return '<i class="'+s+'" title="'+P.ladderSteps[i]+'"></i>'}).join('')});
$('mini').innerHTML=m;
var problems=0;P.stages.forEach(function(s){s.facts.forEach(function(f){if(f[0]==='q'||f[0]==='bad')problems++})});
var tabs=[['ov','Overview'],['work','Progress'],['deploy','Deployment'],['qa','Quality'],['dec','Decisions and questions']];
$('tabs').innerHTML=tabs.map(function(t,i){return '<button role="tab" id="tab-'+t[0]+'" aria-controls="p-'+t[0]+'" aria-selected="'+(i===0)+'" tabindex="'+(i?-1:0)+'">'+t[1]+(t[0]==='deploy'?'<span class="cnt">'+P.dDone+' of '+P.dTotal+'</span>':'')+'</button>'}).join('');
function ul(a,c){return '<ul class="'+c+'">'+a+'</ul>'}
var hi=P.blockers.filter(function(b){return b.sev==='high'}).length,mid=P.blockers.filter(function(b){return b.sev==='mid'}).length,lo=P.blockers.filter(function(b){return b.sev==='low'}).length,SV={high:'critical',mid:'important',low:'minor'};
var ov='<p class="ans">Ready to release? '+(P.ready?'Yes':'No')+'<span'+(P.ready?' style="color:var(--ok)"':'')+'>.</span></p><p class="why">'+(P.summary||'')+'</p><div class="chips"><span class="chip"><i class="dt h"></i><b>'+hi+'</b> critical</span><span class="chip"><i class="dt m"></i><b>'+mid+'</b> important</span><span class="chip"><i class="dt l"></i><b>'+lo+'</b> minor</span><span class="chip"><i class="dt k"></i>deployed <b>'+P.dDone+'</b> of '+P.dTotal+' steps</span></div>'+
'<div class="ovg"><div><h2>What blocks the release</h2><ol class="bl">'+P.blockers.map(function(b){return '<li class="bk '+b.sev+'"><h3><span class="sv '+b.sev+'">'+SV[b.sev]+'</span>'+b.t+b.proj.map(function(p){return '<span class="pj">'+p+'</span>'}).join('')+'</h3><p>'+b.why+'</p><div class="td"><b>To do</b>'+b.todo+'<button type="button" data-stage="'+b.stage+'">stage '+b.stage+'</button></div></li>'}).join('')+'</ol></div><div><h2>What to do, in order</h2><ol class="sq">'+P.nextSteps.map(function(x){return '<li><span>'+x+'</span></li>'}).join('')+'</ol></div></div>';
// work
var w='<div class="md"><div class="list" role="tablist" aria-orientation="vertical" aria-label="Stages" id="stl">'+P.stages.map(function(s,i){return '<button class="item" role="tab" data-i="'+i+'" aria-selected="'+(i===0)+'"><span class="bd '+s.state+'">'+s.n+'</span><span class="tt">'+s.title+'</span><span class="vv">'+s.verdict+'</span></button>'}).join('')+'</div><div class="det" id="det" role="tabpanel" tabindex="0"></div></div>';
// deploy
var d='<div class="md"><div class="list" id="dl">'+P.deploy.map(function(x,i){return '<button class="item" data-i="'+i+'" aria-selected="'+(i===0)+'"><span class="bd '+x.cls+'">'+x.n+'</span><span class="tt">'+x.title+'</span><span class="vv">'+x.done+' of '+x.total+' · '+x.stateText+'<span class="bar" style="display:block"><i style="width:'+Math.round(100*x.done/Math.max(x.total,1))+'%"></i></span></span></button>'}).join('')+'<button class="item" data-i="r" aria-selected="false"><span class="bd no">↺</span><span class="tt">Rollback</span><span class="vv">described</span></button></div><div class="det" id="ddet" tabindex="0"></div></div>';
// qa
var pr=P.projects;
var q='<table class="mx"><thead><tr><th></th>'+pr.map(function(p){return '<th>'+p+'</th>'}).join('')+'</tr></thead><tbody>'+P.checks.map(function(c,ci){return '<tr><td class="k">'+c.name+(c.hint?'<small>'+c.hint+'</small>':'')+'</td>'+pr.map(function(p){var x=c.cells[p];return '<td><button data-c="'+ci+'" data-p="'+p+'" class="'+x[0]+'" aria-pressed="false">'+IC[x[0]]+' '+x[1]+'</button></td>'}).join('')+'</tr>'}).join('')+'</tbody></table><div class="note" id="note" aria-live="polite">Click a cell to see the explanation.</div>';
// dec
var dc='<div class="two"><div class="det"><h2>Decided</h2><ul>'+P.decisions.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div><div class="det"><h2>Open</h2><ul>'+P.questions.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div></div>';
$('main').innerHTML=[['ov',ov],['work',w],['deploy',d],['qa',q],['dec',dc]].map(function(x,i){return '<section role="tabpanel" id="p-'+x[0]+'" aria-labelledby="tab-'+x[0]+'"'+(i?' hidden':'')+'>'+x[1]+'</section>'}).join('');
// tabs behaviour
var tb=[].slice.call(document.querySelectorAll('#tabs button'));
function show(k){tb.forEach(function(b){var on=b.id==='tab-'+k;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1});['ov','work','deploy','qa','dec'].forEach(function(x){$('p-'+x).hidden=x!==k})}
tb.forEach(function(b,i){b.addEventListener('click',function(){show(b.id.slice(4))});b.addEventListener('keydown',function(e){var n=e.key==='ArrowRight'?i+1:e.key==='ArrowLeft'?i-1:null;if(n===null)return;n=(n+tb.length)%tb.length;tb[n].focus();show(tb[n].id.slice(4))})});
// stage detail
var cur=0;

var FORM=null,INBOX={},ROUTE=null,BUSY=false;
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hm(ts){var d=new Date(ts);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function routeText(r){if(!r)return ['b','Finding where to send this…'];
 if(r.route==='active')return ['a','Open session:'+(r.name?' <b>'+esc(r.name)+'</b>':'')+(r.project?' ('+esc(r.project)+')':'')+'. If it is waiting for input, the message wakes it; if it is busy, the message arrives as soon as it is free.'];
 if(r.route==='bg')return ['b','No session is open. A closed session of this feature will be resumed in the background with its previous context and receive the message. To watch it: <code>claude attach</code>.'];
 return ['b','No session is linked to this feature yet, so nobody will receive this. <button type="button" class="lnk" data-ses="open">Choose a session</button> and it goes there right away. Or send it anyway: it waits for the first session that starts working on this feature.']}
function statusLine(e){if(!e)return '';var st=e.state,when=hm(e.ts),who=e.sessionName||'';
 if(st==='done')return '<div class="sent done">Done'+(e.note?': '+esc(e.note):'')+'</div>';
 if(st==='failed')return '<div class="sent failed">Not delivered: '+esc(e.error||'error')+'</div>';
 if(st==='delivered')return '<div class="sent">'+(e.route==='bg'?'Sent at '+when+'. The session is running in the background, waiting for the reply. To watch it: <code>claude attach</code>.':'Delivered at '+hm(e.deliveredAt||e.ts)+(who?' to session '+esc(who):'')+', waiting for the reply.')+'</div>';
 return '<div class="sent">Sent at '+when+'. '+(e.route==='active'?'Waiting to be delivered'+(who?' to session '+esc(who):'')+'.':'Waiting for a session on this feature.')+'</div>'}
function factLi(s,f,fi){var fid=(s.fids||[])[fi],kind=f[0],live=P.live&&fid,skipped=kind==='n',open=FORM&&FORM.fid===fid;
 var acts='';
 if(live){if(skipped)acts='<span class="acts"><button type="button" data-a="unskip">Restore</button></span>';
  else acts='<span class="acts">'+(DONE_K[kind]?'':'<button type="button" data-a="do">Do it</button>')+'<button type="button" data-a="ask">Ask</button>'+(DONE_K[kind]?'':'<button type="button" data-a="skip">Not needed</button>')+'</span>'}
 var form='';
 if(open){var rt=FORM.a==='skip'?['a','Applies immediately: the item stops counting as unfinished, and your decision stays in the dashboard with your reason.']:routeText(ROUTE),
  ph={do:'What exactly to do, if you want to specify (optional)',ask:'Your question about this item',skip:'Why this is not needed (the reason is kept in the dashboard)'}[FORM.a],
  lab={do:'Send to the session',ask:'Send the question',skip:'Mark as "not needed"'}[FORM.a];
  form='<div class="fm"><textarea id="ftext" placeholder="'+ph+'" aria-label="'+ph+'">'+esc(FORM.text||'')+'</textarea><div class="rt '+(FORM.err?'err':rt[0])+'"><span class="dot"></span><span>'+(FORM.err?esc(FORM.err):rt[1])+'</span></div><div class="row"><button type="button" class="go" data-go="1"'+(BUSY?' disabled':'')+'>'+lab+'</button><button type="button" class="cx" data-cx="1">Cancel</button></div></div>'}
 return '<li class="fi'+(live&&!DONE_K[kind]&&!skipped?' todo':'')+(skipped?' skipped':'')+(open?' open':'')+'" data-fid="'+esc(fid||'')+'"><i class="ico '+kind+'">'+(IC[kind]||'—')+'</i><span class="ft"><span class="t">'+f[1]+'</span>'+(skipped?'<em class="why">not needed: '+esc((s.reasons||{})[fi]||'no reason given')+'</em>':'')+'</span>'+acts+form+(live?statusLine(INBOX[fid]):'')+'</li>'}
function queue(){var n=0;Object.keys(INBOX).forEach(function(k){var e=INBOX[k];if(e.state==='new'||e.state==='delivered')n++});var q=$('qb');if(q)q.textContent=n?'Waiting for a reply: '+n:''}
function renderStage(i){cur=i;var s=P.stages[i];
 document.querySelectorAll('#stl .item').forEach(function(b){b.setAttribute('aria-selected',+b.dataset.i===i)});
 var tg={ok:['ok','Done'],part:['part','Partly done'],bad:['bad','Had mistakes or rework'],no:['no','Not started']}[s.state];
 $('det').innerHTML='<h2>'+s.n+'. '+s.title+'</h2><p class="vv"><span class="tag '+tg[0]+'">'+tg[1]+'</span>'+(s.unplanned?'<span class="tag bad">not in the plan</span>':'')+s.verdict+'</p><div class="pf"><div><h3>What the stage included</h3>'+(s.plan.length?ul(s.plan.map(function(p){return '<li>'+p+'</li>'}).join(''),'plan'):'<div class="empty">This stage was not in the plan</div>')+'</div><div><h3>What was done, what was not</h3>'+ul(s.facts.map(function(f,fi){return factLi(s,f,fi)}).join(''),'fact')+'</div></div><div class="nav"><button id="pv"'+(i===0?' disabled':'')+'>← '+(i?'Stage '+P.stages[i-1].n:'')+'</button><button id="nx"'+(i===P.stages.length-1?' disabled':'')+'>'+(i<P.stages.length-1?'Stage '+P.stages[i+1].n:'')+' →</button></div>';
 $('pv').onclick=function(){renderStage(cur-1)};$('nx').onclick=function(){renderStage(cur+1)};queue();}
function post(body){return fetch('/api/act',{method:'POST',headers:{'Content-Type':'application/json','X-Whatnow':'1'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})}
$('det').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.ses==='open'){SES.pick=true;SES.err='';sesBar();window.scrollTo({top:0,behavior:'smooth'});return}var li=b.closest('.fi');
 if(b.dataset.a==='unskip'){post({feature:P.slug,fid:li.dataset.fid,action:'unskip'}).then(function(r){if(r.ok)location.hash='work/'+P.stages[cur].n,location.reload()});return}
 if(b.dataset.a){FORM={fid:li.dataset.fid,a:b.dataset.a,text:''};ROUTE=null;renderStage(cur);var t=$('ftext');if(t)t.focus();
  if(b.dataset.a!=='skip')fetch('/api/route?feature='+encodeURIComponent(P.slug)).then(function(r){return r.json()}).then(function(r){ROUTE=r;if(FORM){FORM.text=($('ftext')||{}).value||FORM.text;renderStage(cur);var t2=$('ftext');if(t2)t2.focus()}}).catch(function(){});return}
 if(b.dataset.cx){FORM=null;renderStage(cur);return}
 if(b.dataset.go&&!BUSY){var txt=($('ftext').value||'').trim();BUSY=true;FORM.text=txt;FORM.err='';renderStage(cur);
  post({feature:P.slug,fid:FORM.fid,action:FORM.a,text:txt}).then(function(r){BUSY=false;
   if(!r.ok){FORM.err=(r.j&&r.j.error)||'could not send';renderStage(cur);return}
   if(FORM.a==='skip'){location.hash='work/'+P.stages[cur].n;location.reload();return}
   if(r.j.entry)INBOX[r.j.entry.fid]=r.j.entry;FORM=null;renderStage(cur)}).catch(function(){BUSY=false;FORM.err='no connection to the server';renderStage(cur)})}});
function pollInbox(){fetch('/api/inbox',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){var m={};(j.entries||[]).filter(function(e){return e.feature===P.slug}).forEach(function(e){m[e.fid]=e});
 if(JSON.stringify(m)!==JSON.stringify(INBOX)){INBOX=m;if(!FORM)renderStage(cur);else queue()}}).catch(function(){})}
$('stl').addEventListener('click',function(e){var b=e.target.closest('.item');if(b)renderStage(+b.dataset.i)});
renderStage(0);
(function(){var m=/^#work\/(\d+)(?:\/([0-9a-f]{10}):(do|ask|skip))?$/.exec(location.hash);if(!m)return;var idx=P.stages.map(function(s){return s.n}).indexOf(+m[1]);if(idx<0)return;
 show('work');if(m[2]&&P.live){FORM={fid:m[2],a:m[3],text:''};ROUTE=null}renderStage(idx)})();
if(P.live){pollInbox();setInterval(pollInbox,3000)}
var SES={bound:[],sessions:[],pick:false,err:''};
function ago2(ts){var m=Math.round((Date.now()-ts)/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'}
function sesName(s){return s.name||s.project||s.id.slice(0,8)}
function sesBar(){var b=$('ses');if(!b||!P.live)return;
 var STX={work:'working',wait:'waiting for you',idle:'open',closed:'closed'};
 var h=SES.bound.length?'<span>Session:</span>'+SES.bound.slice(0,3).map(function(s){return '<b>'+esc(sesName(s))+'</b><span class="st '+s.state+'">'+STX[s.state]+'</span>'}).join(' ')+'<button type="button" data-ses="pick">'+(SES.pick?'Close':'Attach another')+'</button>'
  :'<span>No session is linked to this feature yet.</span><button type="button" data-ses="pick">'+(SES.pick?'Close':'Attach a session')+'</button>';
 if(SES.pick){h+='<div class="pick">'+(SES.err?'<div class="rt err"><span>'+esc(SES.err)+'</span></div>':'')+(SES.sessions.length?'<ul>'+SES.sessions.map(function(s){return '<li><button type="button" data-ses="'+esc(s.id)+'"><b>'+esc(sesName(s))+'</b><span class="st '+s.state+'">'+STX[s.state]+'</span><small>'+esc(s.project)+(s.what?' · '+esc(s.what):'')+' · '+ago2(s.t)+(s.other?' · now on: '+esc(s.other):'')+'</small></button></li>'}).join('')+'</ul>':'<small>No sessions seen yet. Install the hooks and work in Claude Code; sessions appear here.</small>')+'</div>'}
 b.innerHTML=h}
function loadSes(){fetch('/api/sessions?feature='+encodeURIComponent(P.slug),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){SES.bound=j.bound||[];SES.sessions=j.sessions||[];sesBar()}).catch(function(){})}
if($('ses'))$('ses').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var v=b.dataset.ses;
 if(v==='pick'){SES.pick=!SES.pick;SES.err='';sesBar();return}
 post({feature:P.slug,action:'attach',session:v}).then(function(r){if(!r.ok){SES.err=(r.j&&r.j.error)||'could not attach';sesBar();return}SES.pick=false;SES.err='';loadSes()}).catch(function(){SES.err='no connection to the server';sesBar()})});
if(P.live){loadSes();setInterval(loadSes,3000)}

// deploy detail
function renderDeploy(i){document.querySelectorAll('#dl .item').forEach(function(b){b.setAttribute('aria-selected',b.dataset.i==i)});
 if(i==='r'){$('ddet').innerHTML='<h2>Rollback</h2><p class="vv">If something goes wrong</p>'+ul(P.rollback.map(function(x){return '<li><i class="ico q">–</i><span>'+x+'</span></li>'}).join(''),'chk');return}
 var x=P.deploy[i];$('ddet').innerHTML='<h2>'+x.n+'. '+x.title+'</h2><p class="vv"><span class="tag '+x.tag+'">'+x.stateText+'</span>'+x.sub+'. Done '+x.done+' of '+x.total+'</p>'+ul(x.items.map(function(t){return '<li><i class="ico '+t.s+'">'+IC[t.s]+'</i><span>'+t.t+'</span></li>'}).join(''),'chk');}
$('dl').addEventListener('click',function(e){var b=e.target.closest('.item');if(b)renderDeploy(b.dataset.i==='r'?'r':+b.dataset.i)});
renderDeploy(0);
$('p-ov').addEventListener('click',function(e){var b=e.target.closest('button[data-stage]');if(!b)return;show('work');renderStage(+b.dataset.stage-1);document.getElementById('tab-work').focus()});
// qa note
$('p-qa').addEventListener('click',function(e){var b=e.target.closest('button[data-c]');if(!b)return;var c=P.checks[+b.dataset.c],x=c.cells[b.dataset.p];
 document.querySelectorAll('.mx button').forEach(function(y){y.setAttribute('aria-pressed',y===b)});
 $('note').innerHTML='<b>'+c.name+', '+b.dataset.p+':</b> '+x[1]+(x[2]?'. '+x[2]:'. No explanation.')});
})();
</script></body></html>
