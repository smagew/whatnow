<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work with Claude</title>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ee;--paper:#fff;--ink:#17231d;--mut:#586860;--line:#d7dfda;--side:#16241e;--ok:#0f7a4a;--part:#e8b13a;--no:#dfe5e1;--bad:#b3261e;--badb:#fbe5e3;--warnb:#fbeccb;--acc:#0b6b4f}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Geologica,system-ui,sans-serif}
:focus-visible{outline:3px solid #2a8cff;outline-offset:2px}
header{background:var(--side);color:#dfe9e3;padding:20px 24px}
.hd{max-width:1100px;margin:0 auto}h1{margin:0;font-size:22px;font-weight:600;color:#fff}.sub{margin:2px 0 14px;font-size:13px;color:#9fb3a8}
main{max-width:1148px;margin:0 auto;padding:20px 24px 70px}
.conn[hidden]{display:none}.conn{float:right;font-size:12.5px;color:#9fb3a8;display:flex;gap:7px;align-items:center}
.cdot{width:9px;height:9px;border-radius:50%;background:#2f9e6a;display:inline-block}.cdot.pulse{animation:pulse 1.6s infinite}.cdot.off{background:#e0a21a;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,158,106,.55)}70%{box-shadow:0 0 0 8px rgba(47,158,106,0)}100%{box-shadow:0 0 0 0 rgba(47,158,106,0)}}
.list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.f{background:var(--paper);border:1px solid var(--line);border-left:6px solid #b7c0cd;border-radius:16px;overflow:hidden}
.f.risk{border-left-color:var(--bad)}.f.warn{border-left-color:#e8b13a}.f.good{border-left-color:var(--ok)}
.f.livework{box-shadow:0 0 0 2px #cfe8dd}.f.livewait{box-shadow:0 0 0 2px #f3dd9c}
.fh{display:grid;grid-template-columns:52px 1fr;gap:4px 14px;padding:14px 18px 8px;text-decoration:none;color:inherit;align-items:center}
.fh:hover .nm{text-decoration:underline}
.ring{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;position:relative;grid-row:1/3}
.ring::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#e3e9e5 0);-webkit-mask:radial-gradient(circle 18px,transparent 98%,#000 100%);mask:radial-gradient(circle 18px,transparent 98%,#000 100%)}
.ring span{position:relative}
.nm{font-weight:600;font-size:17px;line-height:1.3}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;align-items:center}
.tg{font-size:11.5px;font-weight:600;border-radius:5px;padding:0 7px;white-space:nowrap}
.tg.h{background:var(--badb);color:var(--bad)}.tg.m{background:var(--warnb);color:#7a5200}.tg.s{background:#e3e8f6;color:#2f3d8a}.tg.w{background:#fbe5e3;color:#8c1d18}.tg.k{background:#dff3e8;color:#0f6b40}
.nx{padding:0 18px 8px 84px;font-size:13px;color:var(--mut)}
.pr{margin:0;padding:2px 18px 10px 84px;display:grid;gap:7px}
.row{display:grid;grid-template-columns:78px 330px minmax(0,1fr) auto;gap:4px 14px;align-items:center;font-size:13px}
.row.lab{font-size:11.5px;color:var(--mut);margin-bottom:-3px}.lbls{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.lbls span{text-align:center;white-space:nowrap}
.row .pn{font-weight:700}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.steps i{height:12px;border-radius:3px;background:var(--no);display:block;cursor:help}
.steps i.ok{background:var(--ok)}.steps i.part{background:linear-gradient(90deg,var(--part) 50%,var(--no) 50%)}
.row .pass{color:var(--mut)}
.lv{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;border-radius:999px;padding:1px 10px;white-space:nowrap}
.lv.work{background:#dff3e8;color:#0f6b40}.lv.wait{background:#fbeccb;color:#7a5200}.lv.bg{background:#e3ecfc;color:#1f5fd0}.lv.idle{background:#e7ece9;color:#586860}
.lv i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}.lv.work i{animation:pulse 1.6s infinite}
.lv small{font-weight:400;opacity:.85}
.evb{all:unset;cursor:pointer;display:block;box-sizing:border-box;padding:6px 18px 10px 84px;font-size:12px;color:var(--acc);font-weight:600}
.evb:hover{text-decoration:underline}.evb:focus-visible{outline:3px solid #2a8cff;outline-offset:-3px}
.evl{margin:0;padding:2px 18px 12px 84px;list-style:none;border-top:1px solid var(--line)}
.evl li{display:grid;grid-template-columns:62px 54px 1fr;gap:6px;padding:4px 0;font-size:12.5px}.evl time{color:var(--mut);font-size:11.5px;font-variant-numeric:tabular-nums}
.evl .p{color:var(--mut);font-weight:600}.evl .ok{color:#0f6b40;font-weight:600}.evl .bad{color:var(--bad);font-weight:600}
.free{margin-top:22px;border:1px dashed #b9c8bf;border-radius:14px;padding:10px 16px;font-size:13px;color:var(--mut);background:#fafcfb}
.free b{color:var(--ink);font-weight:600}.free ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:5px}
.free li{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.free .br{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.done{margin:18px 2px 0;font-size:13px;color:var(--mut)}.done a{color:var(--acc);font-weight:600;margin-left:8px;text-decoration:none}.done a:hover{text-decoration:underline}
.broken{background:#fbe5e3;color:#8c1d18;border-radius:12px;padding:10px 16px;margin-bottom:16px;font-size:13.5px}
.welcome{background:#fff;border:1px dashed #b9c8bf;border-radius:16px;padding:34px 24px;text-align:center;color:var(--mut)}.welcome b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.legend{margin:0 0 14px;font-size:13px;color:var(--mut);display:flex;gap:16px;flex-wrap:wrap;align-items:center}.legend b{color:var(--ink);font-weight:600}.legend .k{display:inline-block;width:22px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:6px}.k.ok{background:var(--ok)}.k.part{background:linear-gradient(90deg,var(--part) 50%,var(--no) 50%)}.k.no{background:var(--no)}
.mockbanner{background:#fbeccb;color:#6d4600;border-radius:10px;padding:7px 14px;font-size:13px;margin-bottom:14px}
@media(max-width:820px){.row.lab{display:none}.row{grid-template-columns:70px 1fr}.row .pass,.row .lvw{grid-column:1/-1}.pr,.nx,.evb,.evl{padding-left:18px}.fh{grid-template-columns:1fr}.ring{grid-row:auto}}
@media(prefers-reduced-motion:reduce){.cdot.pulse,.lv.work i{animation:none}}
.tabs{display:flex;gap:4px}.tabs[hidden]{display:none}.tabs button{all:unset;cursor:pointer;color:#9fb3a8;padding:8px 16px;border-radius:10px 10px 0 0;font-weight:600;font-size:14px}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink)}.tabs button:focus-visible{outline:3px solid #7ab8ff}
.tabs .n{font-size:12px;background:#ffffff26;border-radius:99px;padding:0 7px;margin-left:6px}.tabs button[aria-selected=true] .n{background:#dfe5e1}
header{padding-bottom:0}
.fl{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;align-items:center}
.fl button{all:unset;cursor:pointer;padding:3px 12px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:13px}
.fl button[aria-pressed=true]{background:var(--side);color:#fff;border-color:var(--side)}.fl button:focus-visible{outline:3px solid #2a8cff}
.fl .sp{flex:1}.fl .hint{font-size:13px;color:var(--mut)}
.sg{margin:20px 0 8px;font-size:15px;font-weight:600;display:flex;gap:10px;align-items:baseline}.sg:first-child{margin-top:0}.sg small{font-weight:400;color:var(--mut);font-size:13px}
.ss{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.s{background:var(--paper);border:1px solid var(--line);border-left:6px solid #c6d0ca;border-radius:12px;padding:11px 16px}
.s.wait{border-left-color:#e8b13a}.s.work{border-left-color:#9fd2b8}.s.bg{border-left-color:#b9cdf3}.s.hid{opacity:.6}
.s.bare{padding:6px 16px}.s.bare .t1{align-items:center}.s.bare .acts{margin-top:0}.s.bare .ago2{margin-right:4px}
.s .t1{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.s .nm2{font-weight:600}
.s .ago2{margin-left:auto;font-size:12.5px;color:var(--mut)}
.st{font-size:12px;font-weight:600;border-radius:99px;padding:1px 10px;background:#e7ece9;color:#586860;white-space:nowrap}.st.wait{background:var(--warnb);color:#7a5200}.st.bg{background:#e3ecfc;color:#1f5fd0}
.st.work::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}
.ftg{font-size:12px;font-weight:600;border-radius:99px;padding:1px 10px;background:#dff3e8;color:#0f6b40;text-decoration:none}.ftg:hover{text-decoration:underline}
.s p{margin:5px 0 0;font-size:13.5px;max-width:80ch}.s p b{font-weight:600;color:var(--mut);font-size:12.5px;margin-right:6px}.s p.a{color:var(--mut)}
.s .acts{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.s .acts button,.s .acts select{all:unset;cursor:pointer;font-size:12px;font-weight:600;padding:2px 9px;border-radius:7px;border:1px solid var(--line);background:#fff}
.s .acts select{font:inherit;font-size:12px;font-weight:600;padding:1px 6px}.s .acts button[disabled]{opacity:.55;cursor:default}.s .acts button:hover{border-color:var(--acc);color:var(--acc)}
.s .acts button.pri{background:var(--side);color:#fff;border-color:var(--side)}.s .acts button.pri:hover{background:var(--acc);border-color:var(--acc);color:#fff}
.s .acts button:focus-visible,.s .acts select:focus-visible{outline:3px solid #2a8cff;outline-offset:1px}
.s .fm{margin-top:8px}.s .fm textarea{width:100%;min-height:58px;border:1px solid #c3cec7;border-radius:8px;padding:8px 10px;font:inherit;font-size:13.5px;resize:vertical}
.s .fm .row2{display:flex;gap:8px;margin-top:6px;align-items:center}.s .go{all:unset;cursor:pointer;background:var(--side);color:#fff;font-size:13px;font-weight:600;padding:5px 14px;border-radius:9px}.s .go[disabled]{opacity:.5}
.s .sent{margin-top:8px;font-size:12.5px;border-radius:8px;padding:5px 10px;background:#e8f0fb;color:#1f4a99}.s .sent.done{background:#e6f4ec;color:#0f6b40}.s .sent.failed,.s .err{background:#fbe5e3;color:#8c1d18}
.s .err{margin-top:6px;font-size:12.5px;border-radius:8px;padding:5px 10px}
@media(max-width:820px){.s .ago2{margin-left:0;flex-basis:100%}}
.star{all:unset;cursor:pointer;font-size:18px;line-height:1;color:#b9c4bd;padding:2px 4px;border-radius:6px}.star:hover{color:#e0a21a}.star.on{color:#e0a21a}.star:focus-visible{outline:3px solid #2a8cff;outline-offset:1px}
.f{position:relative}.f>.star{position:absolute;right:12px;top:10px}.s .t1 .star{margin-left:-4px}
.fvh{margin:22px 0 8px;font-size:15px;font-weight:600}.fvh:first-child{margin-top:0}
.fv .list{margin-bottom:6px}
.stg{display:flex;gap:3px;margin:10px 18px 0 84px;align-items:flex-end}
.sgc{flex:1;min-width:0;max-width:74px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:help}
.sgc b{font-weight:400;font-size:13px;line-height:1;height:14px}
.sgc i{display:block;width:100%;height:9px;border-radius:3px;background:#dfe5e1}
.sgc.ok i{background:var(--ok)}.sgc.almost i{background:#6fc59b}.sgc.part i{background:#e8b13a}.sgc.bad i{background:#c3453d}
.sgc.cur i{box-shadow:0 0 0 2px #fff,0 0 0 4px #1f5fd0}
.stn{margin:9px 18px 0 84px;font-size:12.5px;color:var(--mut)}.stn b{color:var(--ink);font-weight:600}
.pjs{display:flex;gap:6px 14px;flex-wrap:wrap;margin:8px 18px 12px 84px;font-size:12.5px}.pj1{display:inline-flex;gap:8px;align-items:center}.pj1 .pn{font-weight:600}
.k.bad{background:#c3453d}
@media(max-width:820px){.stg,.stn,.pjs{margin-left:18px}}

   one on screen, so going from one page to another never shows a half-drawn page. Shown anyway after 1.5 s. */
body:not(.wnok){visibility:hidden;animation:wnshow 0s 1.5s forwards}@keyframes wnshow{to{visibility:visible}}
</style>
<script>window.IDX_DATA=/*__DATA__*/null;</script></head><body>
<header><div class="hd"><span class="conn" id="connbox" hidden><span class="cdot pulse" id="cdot"></span><span id="conn"></span></span><h1>Work with Claude</h1><p class="sub" id="sub"></p><div class="tabs" role="tablist" id="tabs" hidden><button role="tab" id="tS" aria-selected="false">Sessions<span class="n" id="nS"></span></button><button role="tab" id="tF" aria-selected="true">Features<span class="n" id="nF"></span></button><button role="tab" id="tV" aria-selected="false">Favorites<span class="n" id="nV"></span></button></div></div></header>
<main>
<div id="mock"></div><div id="broken"></div>
<div id="pS" hidden><div class="fl" id="fl"></div><div id="sess"></div></div>
<div id="pV" hidden><div id="fav"></div></div>
<div id="pF">
<p class="legend" id="legend" hidden><b>The stages of each plan, left to right:</b><span><i class="k ok"></i>done</span><span><i class="k part"></i>in progress</span><span><i class="k bad"></i>open problem</span><span><i class="k no"></i>not started</span><span>the percent is the share of the plan that is done; hover a stage for details</span></p>
<ol class="list" id="list"></ol>
<div id="free"></div>
<div class="done" id="done"></div>
</div></main>
<script>
(function(){
var D=window.IDX_DATA,$=function(i){return document.getElementById(i)};
var KI=D.kinds||{},SST={ok:'done',almost:'almost done',part:'in progress',bad:'has an open problem',no:'not started'};
var open={},lastJson='',lastOk=Date.now();
function ago(d){return d<=0?'today':d===1?'yesterday':d+' d ago'}
function agoMs(ms){var s=Math.max(0,Math.round((Date.now()-ms)/1000));if(s<5)return 'just now';if(s<60)return s+' s ago';var m=Math.round(s/60);return m<60?m+' min ago':Math.round(m/60)+' h ago'}
function hm(ts){var d=new Date(ts);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2)}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
// text from feature.json: everything is escaped, only <code> and <b> survive (entities already written stay as they are)
function rich(t){return String(t==null?'':t).replace(/&(?!(?:[a-z]+|#\d+|#x[0-9a-f]+);)/gi,'&amp;').replace(/[<>"]/g,function(c){return{'<':'&lt;','>':'&gt;','"':'&quot;'}[c]}).replace(/&lt;(\/?)(code|b)&gt;/g,'<$1$2>')}
var LV={work:'working',bg:'background task running',wait:'waiting for you',idle:'session open'},rank={work:0,bg:1,wait:2,idle:3};
function chip(s,withWhat){return '<span class="lv '+s.state+'"><i></i>'+LV[s.state]+(withWhat&&s.what&&s.state==='work'?': '+esc(s.what):'')+(s.quiet?'':' <small class="ago" data-t="'+s.t+'">'+agoMs(s.t)+'</small>')+'</span>'}
function paint(D){
 paintS(D);
 var F=D.features,evs=D.events||{};
 var tracked={};F.forEach(function(f){f.projects.forEach(function(p){tracked[p]=1})});
 var sess=(D.sessions||[]).filter(function(s){return !s.hidden&&s.state!=='closed'&&(tracked[s.project]||s.feature)});   // projects that features belong to, or sessions linked to a feature
 var active=F.filter(function(f){return !f.done}),finished=F.filter(function(f){return f.done});
 if(!D.live)$('sub').textContent='Updated '+D.today+'. Features in progress: '+active.length+(finished.length?', finished: '+finished.length:'')+'.';
 $('broken').innerHTML=D.broken.length?'<div class="broken"><b>Could not read:</b> '+D.broken.map(function(b){return esc(b.id)+' ('+esc(b.error)+')'}).join('; ')+'</div>':'';
 if(!F.length){$('list').innerHTML='<div class="welcome"><b>No features yet</b>Start a large piece of work with the whatnow skill and it will show up here.</div>';$('free').innerHTML='';$('done').innerHTML='';$('legend').hidden=true;return}
 active.sort(function(a,b){return (b.h-a.h)||(((b.m||b.stale)?1:0)-((a.m||a.stale)?1:0))||a.pct-b.pct});
 var fcard=function(f){
  var mine=sess.filter(function(s){return s.feature===f.id}).sort(function(a,b){return rank[a.state]-rank[b.state]||b.t-a.t});
  var risk=f.h?'risk':(f.m||f.stale)?'warn':(f.pct>=80?'good':'');
  var c=f.h?'#c3453d':(f.m||f.stale)?'#e0a21a':'#0f7a4a';
  var live=mine.length&&mine[0].state!=='idle'?' live'+mine[0].state:'';
  var tags=(f.h?'<span class="tg h">'+f.h+' critical</span>':'')+(f.m?'<span class="tg m">'+f.m+' important</span>':'')+(f.waiting?'<span class="tg w">'+f.waiting+' waiting for you</span>':'')+(f.stale?'<span class="tg s">not updated '+ago(f.days)+'</span>':'')+((!f.h&&!f.m&&!f.stale)?'<span class="tg k">no blockers</span>':'');
  var key=f.id,ev=evs[f.id]||[],isOpen=open[key];
  return '<li><div class="f '+risk+live+'">'+starBtn('f:'+f.id)+
   '<a class="fh" href="'+esc(f.href)+'"><div class="ring" style="--p:'+f.pct+';--c:'+c+'"><span>'+f.pct+'%</span></div><div><span class="nm">'+esc(f.name)+'</span><div class="tags">'+tags+'<span style="font-size:12px;color:var(--mut)">updated '+ago(f.days)+'</span></div></div></a>'+
   (f.next?'<div class="nx"><b style="font-weight:600;color:var(--ink)">Next:</b> '+rich(f.next)+'</div>':'')+
   '<div class="stg" role="img" aria-label="'+esc(f.stages.map(function(x){return x.n+'. '+x.title+': '+SST[x.state]}).join('; '))+'">'+f.stages.map(function(x){var k=KI[x.kind];
     return '<span class="sgc '+x.state+(x.n===f.cur?' cur':'')+'" title="'+esc(x.n+'. '+x.title+'\n'+(k?k[1]+'. ':'')+SST[x.state]+(x.tot?', '+x.dn+' of '+x.tot+' done':'')+(x.n===f.cur?'\nThe work is here now.':''))+'"><b>'+(k?k[0]:'')+'</b><i></i></span>'}).join('')+'</div>'+
   '<div class="stn">'+(function(){var c=f.stages.filter(function(x){return x.n===f.cur})[0],dn=f.stages.filter(function(x){return x.state==='ok'}).length;return dn+' of '+f.stages.length+' stages done'+(c?'. Now: <b>'+c.n+'. '+esc(c.title)+'</b>':'')})()+'</div>'+
   '<div class="pjs">'+f.projects.map(function(p){var ps=mine.filter(function(s){return s.project===p});return '<span class="pj1"><span class="pn">'+esc(p)+'</span>'+(ps[0]?chip(ps[0],true):'')+'</span>'}).join('')+'</div>'+
   (ev.length?'<button type="button" class="evb" data-k="'+esc(key)+'" aria-expanded="'+(!!isOpen)+'">'+(isOpen?'Hide events':'Events ('+ev.length+')')+'</button>'+(isOpen?'<ul class="evl">'+ev.slice(0,10).map(function(e){return '<li><time>'+hm(e.ts)+'</time><span class="p">'+esc(e.p||'')+'</span><span class="'+e.k+'">'+esc(e.t)+'</span></li>'}).join('')+'</ul>':''):'')+
   '</div></li>'};
 $('list').innerHTML=active.map(fcard).join('');
 paintFav(D,fcard);
 $('free').innerHTML='';
 $('legend').hidden=false;
 $('done').innerHTML=finished.length?'Finished:'+finished.map(function(f){return '<a href="'+esc(f.href)+'">'+esc(f.name)+'</a>'}).join(''):'';
}
$('list').addEventListener('click',function(e){var b=e.target.closest('.evb');if(!b)return;open[b.dataset.k]=!open[b.dataset.k];paint(window.IDX_DATA)});

// ---------------------------------------------------------------- Sessions tab
var SF={f:'all',showHidden:false,form:null,attach:null,menu:null,sent:{},err:{},copied:''};
function post(body){return fetch('/api/act',{method:'POST',headers:{'Content-Type':'application/json','X-Whatnow':'1'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})}
function agoM(ts){var m=Math.round((Date.now()-ts)/60000);return m<2?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'}
function hmS(ts){var d=new Date(ts);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function sentLine(e){if(!e)return '';var st=e.state;
 if(st==='done')return '<div class="sent done">Done'+(e.note?': '+esc(e.note):'')+'</div>';
 if(st==='failed')return '<div class="sent failed">Not delivered: '+esc(e.error||'error')+'</div>';
 if(st==='delivered')return '<div class="sent">'+(e.route==='bg'?'Sent at '+hmS(e.ts)+'. The session runs in the background and is working on it.':'Delivered at '+hmS(e.deliveredAt||e.ts)+', waiting for the reply.')+'</div>';
 return '<div class="sent">Sent at '+hmS(e.ts)+'. Waiting to be delivered: the session gets it when it is free.</div>'}
function stOf(s){return s.state==='work'||s.state==='bg'?s.state:s.state==='closed'?'closed':'wait'}
function isBare(s){return !s.first&&!s.lastU&&!s.lastA}                    // nothing known about it: shown as one line
function rankS(s){var st=stOf(s);return st==='wait'&&!isBare(s)?0:st==='work'||st==='bg'?1:2}   // what waits for you comes first
function sessCard(s,D){var open=SF.form&&SF.form.id===s.id,att=SF.attach===s.id,st=stOf(s),bare=isBare(s),more=SF.menu===s.id||att;
 var feats=(D.features||[]).filter(function(f){return !f.done});
 var pill=bare&&st==='wait'?['idle','open']:[st,{work:'working',bg:'background task running',wait:'waiting for you',closed:'closed'}[st]];

 var h='<li class="s '+pill[0]+(bare?' bare':'')+(s.hidden?' hid':'')+'" data-id="'+esc(s.id)+'"><div class="t1">'+starBtn('s:'+s.id)+'<span class="nm2">'+esc(s.name||s.project||s.id.slice(0,8))+'</span><span class="st '+pill[0]+'">'+pill[1]+'</span>'+
  (s.feature?'<a class="ftg" href="/f/'+esc(s.feature)+'/">feature: '+esc((D.features.filter(function(f){return f.id===s.feature})[0]||{name:s.feature}).name)+'</a>':'')+
  '<span class="ago2">'+(s.quiet?'no activity seen':'last activity <span class="ago" data-t="'+s.t+'">'+agoM(s.t)+'</span>')+'</span>'+(bare?acts:'')+'</div>'+
  (s.first?'<p><b>Started with</b>'+esc(s.first)+'</p>':'')+(s.lastU&&s.lastU!==s.first?'<p><b>You last asked</b>'+esc(s.lastU)+'</p>':'')+(s.lastA?'<p class="a"><b>Claude last said</b>'+esc(s.lastA)+'</p>':'')+
  (bare?'':acts)+
  (open?'<div class="fm"><textarea id="stext" placeholder="Message to this session" aria-label="Message to this session">'+esc(SF.form.text||'')+'</textarea><div class="row2"><button type="button" class="go" data-a="send"'+(SF.form.busy?' disabled':'')+'>Send</button><button type="button" data-a="cancel" style="all:unset;cursor:pointer;color:var(--mut);font-size:13px">Cancel</button></div></div>':'')+
  (SF.err[s.id]?'<div class="err">'+esc(SF.err[s.id])+'</div>':'')+sentLine(SF.sent[s.id])+'</li>';
 return h}
function paintS(D){if(!D.live)return;var all=D.sessions||[];var vis=all.filter(function(s){return s.state!=='closed'&&(SF.showHidden||!s.hidden)});
 var rows=vis.filter(function(s){return SF.f==='all'||(SF.f==='wait'&&rankS(s)===0)||(SF.f==='busy'&&(s.state==='work'||s.state==='bg'))||(SF.f==='feat'&&s.feature)});
 var by={};rows.forEach(function(s){(by[s.group]=by[s.group]||[]).push(s)});
 var top=function(k){return Math.min.apply(0,by[k].map(rankS))},late=function(k){return Math.max.apply(0,by[k].map(function(s){return s.t}))};

 var nh=all.filter(function(s){return s.hidden&&s.state!=='closed'}).length,waitN=all.filter(function(s){return !s.hidden&&s.state!=='closed'&&rankS(s)===0}).length,work=all.filter(function(s){return !s.hidden&&(s.state==='work'||s.state==='bg')}).length,nv=all.filter(function(s){return s.state!=='closed'}).length-all.filter(function(s){return s.hidden&&s.state!=='closed'}).length;
 $('nS').textContent=nv;$('nF').textContent=D.features.filter(function(f){return !f.done}).length;
 $('fl').innerHTML=[['all','All'],['wait','Waiting for you'],['busy','Working now'],['feat','On a feature']].map(function(f){return '<button type="button" data-f="'+f[0]+'" aria-pressed="'+(SF.f===f[0])+'">'+f[1]+'</button>'}).join('')+'<span class="sp"></span>'+(nh?'<button type="button" data-f="hidden" aria-pressed="'+SF.showHidden+'">Hidden: '+nh+'</button>':'')+'<span class="hint">Grouped by project, what waits for you first</span>';
 var ta=document.activeElement&&document.activeElement.id==='stext';
 $('sess').innerHTML=keys.map(function(k){var it=by[k].sort(function(a,b){return rankS(a)-rankS(b)||b.t-a.t});return '<h2 class="sg">'+esc(k)+' <small>'+it.length+' session'+(it.length>1?'s':'')+'</small></h2><ol class="ss">'+it.map(function(s){return sessCard(s,D)}).join('')+'</ol>'}).join('')||'<div class="welcome"><b>No sessions</b>Open sessions of Claude Code show up here.</div>';
 if(ta){var x=$('stext');if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length)}}
 if(D.live)$('sub').textContent=nv+' session'+(nv===1?'':'s')+' open, '+waitN+' waiting for you, '+work+' working now.'}
$('fl').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.f==='hidden')SF.showHidden=!SF.showHidden;else SF.f=b.dataset.f;paintS(window.IDX_DATA)});

 if(a==='track'){post({action:'track',session:id}).then(function(r){if(!r.ok)SF.err[id]=(r.j&&r.j.error)||'could not send';else SF.sent[id]=r.j.entry;paintS(window.IDX_DATA)}).catch(function(){SF.err[id]='no connection to the server';paintS(window.IDX_DATA)});return}

 if(a==='attach-x'){SF.attach=null;paintS(D);return}
 if(a==='attach-go'){var f=($('fsel')||{}).value;if(!f){SF.err[id]='Choose a feature first';paintS(D);return}
  post({action:'attach',feature:f,session:id}).then(function(r){if(!r.ok)SF.err[id]=(r.j&&r.j.error)||'could not attach';SF.attach=null;pollNow()}).catch(function(){SF.err[id]='no connection to the server';paintS(D)});return}
 if(a==='hide'||a==='unhide'){post({action:a,session:id}).then(function(){pollNow()});return}
