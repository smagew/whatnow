<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Функции в работе</title>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ee;--paper:#fff;--ink:#17231d;--mut:#586860;--line:#d7dfda;--side:#16241e;--ok:#2f9e6a;--part:#e8b13a;--no:#dfe5e1;--bad:#b3261e;--badb:#fbe5e3;--warnb:#fbeccb;--acc:#0b6b4f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Geologica,system-ui,sans-serif}
:focus-visible{outline:3px solid #2a8cff;outline-offset:2px}
header{background:var(--side);color:#dfe9e3;padding:20px 24px}
.hd{max-width:1400px;margin:0 auto}h1{margin:0;font-size:22px;font-weight:600;color:#fff}.sub{margin:2px 0 0;font-size:13px;color:#9fb3a8}
main{max-width:1400px;margin:0 auto;padding:20px 24px 70px}
h2{margin:0 0 10px;font-size:17px;font-weight:600}
.att{background:#fff;border:1px solid #e3a39e;border-left:6px solid var(--bad);border-radius:14px;padding:14px 18px;margin-bottom:22px}
.att ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.att li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;font-size:14px}
.att a{color:inherit;text-decoration:none}.att a:hover b{text-decoration:underline}
.tg{font-size:11.5px;font-weight:600;border-radius:5px;padding:0 7px;white-space:nowrap}
.tg.h{background:var(--badb);color:var(--bad)}.tg.s{background:#e3e8f6;color:#2f3d8a}.tg.m{background:var(--warnb);color:#7a5200}
.att small{color:var(--mut)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.pc{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ph{padding:14px 16px 12px;border-bottom:1px solid var(--line);background:#f6faf8}
.ph h3{margin:0;font-size:20px;font-weight:700;display:flex;gap:10px;align-items:baseline}
.ph h3 span{font-size:13px;font-weight:500;color:var(--mut)}
.ins{margin:6px 0 0;font-size:13px;color:#7a5200;background:var(--warnb);border-radius:8px;padding:5px 10px}
.ins.calm{background:#dff3e8;color:#0f6b40}
.list{margin:0;padding:8px;list-style:none;display:grid;gap:6px}
.it{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;position:relative}
.it:hover,.it.hl{border-color:#2f9e6a;box-shadow:0 0 0 2px #cfe8dd}
.it.high{border-left:5px solid var(--bad)}.it.stale{border-style:dashed}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nm{font-weight:600;font-size:13.5px;line-height:1.3}.pct{font-weight:700;font-size:13px;color:var(--mut)}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:8px 0 4px}
.steps i{height:10px;border-radius:3px;background:var(--no);display:block}
.steps i.ok{background:var(--ok)}.steps i.part{background:linear-gradient(90deg,var(--part) 50%,var(--no) 50%)}
.where{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.also{font-size:11.5px;color:#7b8a82;margin-top:3px}
.also b{font-weight:600;color:var(--mut)}
.empty{padding:16px;color:var(--mut);font-size:13px}
.legend{margin:16px 2px 0;font-size:12.5px;color:var(--mut)}
@media(max-width:980px){.cols{grid-template-columns:1fr}.att li{grid-template-columns:1fr}}

.calm-note{margin:0;font-size:14px;color:#0f6b40}
.att.ok{border-color:#bfe0cf;border-left-color:#2f9e6a}
.welcome{background:#fff;border:1px dashed #b9c8bf;border-radius:16px;padding:34px 24px;text-align:center;color:var(--mut)}
.welcome b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.done{margin:22px 2px 0;font-size:13px;color:var(--mut)}.done a{color:var(--acc);font-weight:600;margin-left:8px;text-decoration:none}.done a:hover{text-decoration:underline}
.broken{background:#fbe5e3;color:#8c1d18;border-radius:12px;padding:10px 16px;margin-bottom:16px;font-size:13.5px}
</style></head><body>
<header><div class="hd"><h1>Функции в работе</h1><p class="sub" id="sub"></p></div></header>
<main>
<div id="broken"></div>
<section class="att" id="attbox" aria-labelledby="ah" hidden><h2 id="ah">Требует внимания сегодня</h2><ul id="att"></ul></section>
<div class="cols" id="cols"></div>
<div class="done" id="done"></div>
<p class="legend" id="legend" hidden>В каждой строке шесть сегментов: Код, Тесты, Ревью, Руками, Staging, Prod, только для этого проекта. Функция, затрагивающая несколько проектов, подсвечивается во всех колонках при наведении.</p>
</main>
<script>window.IDX_DATA=/*__DATA__*/null;</script>
<script>
(function(){
var D=window.IDX_DATA,F=D.features,P=D.projects,$=function(i){return document.getElementById(i)};
var SHORT=['Код','Тесты','Ревью','Руками','Staging','Prod'];
function ago(d){return d<=0?'сегодня':d===1?'вчера':d+' дн. назад'}
var active=F.filter(function(f){return !f.done}),finished=F.filter(function(f){return f.done});
$('sub').textContent='Обновлено '+D.today+'. Функций в работе: '+active.length+(finished.length?', завершено: '+finished.length:'')+'.';
if(D.broken.length)$('broken').innerHTML='<div class="broken"><b>Не удалось прочитать:</b> '+D.broken.map(function(b){return b.id+' ('+b.error+')'}).join('; ')+'</div>';
if(!F.length){$('cols').innerHTML='<div class="welcome" style="grid-column:1/-1"><b>Пока нет ни одной функции</b>Начните большую работу с навыком whatnow, и она появится здесь.</div>'}
else{
 var A=active.filter(function(f){return f.h||f.stale}).sort(function(a,b){return b.h-a.h||b.days-a.days});
 $('attbox').hidden=false;
 if(A.length){$('att').innerHTML=A.map(function(f){return '<li><span>'+(f.h?'<span class="tg h">'+f.h+' критичных</span>':'<span class="tg s">'+ago(f.days)+'</span>')+'</span><a href="'+f.href+'"><b>'+f.name+'</b> <small>'+(f.why||f.next||'')+'</small></a><small>'+f.projects.join(', ')+'</small></li>'}).join('')}
 else{$('attbox').className='att ok';$('att').innerHTML='<li class="calm-note" style="display:block">Всё спокойно: критичных проблем и давно не обновлявшихся функций нет.</li>'}
 function lastPassed(l){var d=-1;for(var i=0;i<6;i++){if(l[i]==='ok')d=i;else break}return d<0?'ничего не пройдено':'пройдено до: '+SHORT[d]}
 $('cols').innerHTML=P.map(function(p){
  var fs=active.filter(function(f){return f.ladder[p]}).sort(function(a,b){var ca=a.ladder[p].filter(function(s){return s==='ok'}).length,cb=b.ladder[p].filter(function(s){return s==='ok'}).length;return ca-cb});
  var noReview=fs.filter(function(f){return f.ladder[p][2]!=='ok'}).length;
  var word=fs.length===1?'функция':(fs.length>1&&fs.length<5?'функции':'функций');
  var ins=fs.length>=4?'<div class="ins">Идёт одновременно '+fs.length+' '+word+', '+noReview+' без ревью. Риск конфликтов при слиянии.</div>':fs.length>=3?'<div class="ins">Идёт одновременно '+fs.length+' '+word+', '+noReview+' без ревью.</div>':'<div class="ins calm">Нагрузка небольшая: '+fs.length+' '+word+'.</div>';
  return '<section class="pc" aria-label="'+p+'"><div class="ph"><h3>'+p+'<span>'+fs.length+' в работе</span></h3>'+ins+'</div><ol class="list">'+(fs.length?fs.map(function(f){var l=f.ladder[p],others=f.projects.filter(function(q){return q!==p});
   return '<li><a class="it'+(f.h?' high':'')+(f.stale?' stale':'')+'" data-id="'+f.id+'" href="'+f.href+'"><div class="top"><span class="nm">'+f.name+'</span><span class="pct">'+f.pct+'%</span></div><div class="steps" aria-hidden="true">'+l.map(function(s){return '<i class="'+s+'"></i>'}).join('')+'</div><div class="where"><span>'+lastPassed(l)+'</span>'+(f.h?'<span class="tg h">'+f.h+' критичных</span>':f.m?'<span class="tg m">'+f.m+' важных</span>':'')+'</div>'+(others.length?'<div class="also">Также: <b>'+others.join(', ')+'</b></div>':'')+'<div class="also">Обновлено '+ago(f.days)+(f.next?'. Дальше: '+f.next:'')+'</div></a></li>'}).join(''):'<li class="empty">Сейчас нет функций</li>')+'</ol></section>'}).join('');
 $('legend').hidden=false;
}
if(finished.length)$('done').innerHTML='Завершено:'+finished.map(function(f){return '<a href="'+f.href+'">'+f.name+'</a>'}).join('');
function hl(id,on){document.querySelectorAll('.it[data-id="'+id+'"]').forEach(function(e){e.classList.toggle('hl',on)})}
['mouseover','focusin'].forEach(function(t){$('cols').addEventListener(t,function(e){var a=e.target.closest('.it');if(a)hl(a.dataset.id,true)})});
['mouseout','focusout'].forEach(function(t){$('cols').addEventListener(t,function(e){var a=e.target.closest('.it');if(a)hl(a.dataset.id,false)})});
})();
</script></body></html>
